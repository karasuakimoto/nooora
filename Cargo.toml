[package]
name = "nooora"
version = "0.1.0"
edition = "2024"
description = "Nooora, a high-concurrency Discord card bot"
license = "MIT"
rust-version = "1.88"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
image = "0.25.10"
imageproc = { version = "0.27.0", features = ["text"] }
moka = { version = "0.12.16", features = ["future"] }
nanoid = "0.5.0"
poise = { version = "0.7.1", features = ["chrono", "cache", "collector"] }
rand = "0.9"
redis = { version = "1.8.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "collector", "chrono"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json", "uuid", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
